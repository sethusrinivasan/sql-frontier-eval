name: Deploy Reports to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Ensure reports directory exists
        run: |
          mkdir -p reports
          if [ ! -f reports/index.html ]; then
            echo "<html><head><title>SQL Frontier Eval Reports</title></head><body><h1>SQL Frontier Eval Reports</h1><p>Evaluation suite reports will be published here.</p></body></html>" > reports/index.html
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "reports"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

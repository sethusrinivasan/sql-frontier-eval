name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  offline-eval-and-tests:
    name: Test & Offline Eval (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start PostgreSQL with Docker Compose
        run: |
          chmod +x setup_postgres.sh
          ./setup_postgres.sh

      - name: Run Unit Test Suite
        run: |
          pytest tests/ -v

      - name: Run Golden Reference Verification (120 Tasks)
        run: |
          python run_eval.py --test-gold

      - name: Run Offline Reference & Anti-Pattern Traps
        run: |
          python run_eval.py --model offline

      - name: Run Full Turnkey Verification Script
        run: |
          chmod +x verify.sh
          ./verify.sh

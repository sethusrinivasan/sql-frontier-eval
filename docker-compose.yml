services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sql_frontier_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sql_frontier_eval
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sql_frontier_eval"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
